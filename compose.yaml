name: multitek-pm

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-app: &app
  image: ${PM_PYTHON_IMAGE:?Set by installer}
  pull_policy: never
  working_dir: /app
  user: '10001:10001'
  init: true
  read_only: true
  security_opt: ['no-new-privileges:true']
  cap_drop: ['ALL']
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
  volumes:
    - ./app:/app:ro
    - packages:/packages:ro
  environment: &app-env
    PYTHONPATH: /packages
    PYTHONUNBUFFERED: '1'
    PYTHONDONTWRITEBYTECODE: '1'
    PM_SECRET_KEY: ${PM_SECRET_KEY:?Set by installer}
    PM_DB_PASSWORD: ${PM_DB_PASSWORD:?Set by installer}
    PM_ALLOWED_HOSTS: ${PM_ALLOWED_HOSTS:-127.0.0.1,localhost}
    PM_PUBLIC_BASE_URL: ${PM_PUBLIC_BASE_URL:-}
    PM_CSRF_ORIGINS: ${PM_CSRF_ORIGINS:-}
    PM_HTTPS: ${PM_HTTPS:-0}
  pids_limit: 128
  logging: *logging
  networks: [pm]

services:
  setup:
    image: ${PM_PYTHON_IMAGE:?Set by installer}
    pull_policy: never
    profiles: ['tools']
    working_dir: /app
    read_only: true
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    tmpfs:
      - /tmp:rw,nosuid,size=256m,mode=1777
    volumes:
      - ./app:/app:ro
      - ./requirements.txt:/requirements.txt:ro
      - packages:/packages
    environment:
      PYTHONPATH: /packages
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PM_SECRET_KEY: 'isolated-test-only-not-used-in-runtime-1234567890'
    command:
      - /bin/sh
      - -ec
      - |
        umask 022
        python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --target=/packages -r /requirements.txt
        python -m pip list --disable-pip-version-check --path=/packages --format=json > /packages/installed-versions.json
        python manage.py check --settings=config.test_settings
        python manage.py makemigrations --check --dry-run --settings=config.test_settings
        python manage.py test maintenance --settings=config.test_settings --noinput --verbosity=2
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.50
    pids_limit: 128
    logging: *logging
    networks: [pm]

  db:
    image: ${PM_POSTGRES_IMAGE:?Set by installer}
    pull_policy: never
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    environment:
      POSTGRES_DB: multitek_pm
      POSTGRES_USER: pm_owner
      POSTGRES_PASSWORD: ${PM_POSTGRES_PASSWORD:?Set by installer}
      PM_DB_PASSWORD: ${PM_DB_PASSWORD:?Set by installer}
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    command: ['postgres','-c','shared_buffers=128MB','-c','max_connections=40','-c','work_mem=4MB','-c','maintenance_work_mem=64MB','-c','max_wal_size=512MB']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    # No published database port. This volume is NOT the Odoo volume.
    healthcheck:
      test: ['CMD-SHELL','pg_isready -h 127.0.0.1 -U pm_owner -d multitek_pm']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.50
    pids_limit: 128
    logging: *logging
    networks: [pm]

  bootstrap:
    <<: *app
    profiles: ['tools']
    env_file: ['./private/bootstrap.env']
    command: ['/bin/sh','-ec','python manage.py migrate --noinput && python manage.py check && python manage.py pm_bootstrap && python manage.py pm_scheduler --once']
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.50

  web:
    <<: *app
    restart: unless-stopped
    command: ['python','-m','gunicorn','config.wsgi:application','--bind','0.0.0.0:8000','--workers','2','--threads','2','--timeout','60','--max-requests','1000','--max-requests-jitter','50','--access-logfile','-','--error-logfile','-','--forwarded-allow-ips=']
    ports:
      - '127.0.0.1:18080:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD','python','-c',"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=4)"]
      interval: 20s
      timeout: 6s
      retries: 6
      start_period: 20s
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.75

  scheduler:
    <<: *app
    restart: unless-stopped
    command: ['python','manage.py','pm_scheduler']
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.25

networks:
  pm: {}
volumes:
  pgdata: {}
  packages:
    # Versioned dependency volume. The previous volume stays available for rollback.
    name: ${PM_PACKAGES_VOLUME:-multitek-pm_packages}
