<div class="pagination"><span>Halaman {{ page.number }} dari {{ page.paginator.num_pages }} &middot; {{ page.paginator.count }} data</span><div>{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&amp;q={{ q|urlencode }}&amp;status={{ status|urlencode }}">Sebelumnya</a>{% endif %} {% if page.has_next %}<a href="?page={{ page.next_page_number }}&amp;q={{ q|urlencode }}&amp;status={{ status|urlencode }}">Berikutnya</a>{% endif %}</div></div>
